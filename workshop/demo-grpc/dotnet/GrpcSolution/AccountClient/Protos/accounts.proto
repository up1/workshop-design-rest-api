syntax = "proto3";
option csharp_namespace = "AccountService"; // Base C# namespace
package account; // gRPC package name
service Account {
  rpc GetAccount (GetAccountRequest) returns (GetAccountResponse) {}
}

message GetAccountRequest {
  int32 id = 1;
}

message GetAccountResponse {
  int32 id = 1;
  string name = 2;
  string email = 3;
  string address = 4;
}